<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriterBox — Editor per romanzi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="editor-wrapper">
  <div id="editor" contenteditable="true" spellcheck="true" lang="it" data-placeholder="Inizia a scrivere il tuo romanzo…"></div>
</main>

<div id="save-indicator" aria-live="polite">Salvato</div>

<div id="toolbar" class="dock-top" role="toolbar" aria-label="Strumenti di editing">

  <button id="drag-handle" class="handle" title="Trascina per riposizionare la barra" aria-label="Trascina per riposizionare">
    <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="7" cy="6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
  </button>

  <div class="sep"></div>

  <button id="btn-title" class="tool" data-cmd="title" title="Trasforma la selezione in Titolo">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5v14M12 5v14M4 12h8M17 8h3v11M17 19h6"/></svg>
    <span>Titolo</span>
  </button>

  <div class="sep"></div>

  <div class="format-group">
    <button id="btn-bold" class="tool icon-only" data-cmd="bold" title="Grassetto">
      <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" style="fill:currentColor;stroke:none;">B</text></svg>
    </button>

    <button id="btn-italic" class="tool icon-only" data-cmd="italic" title="Corsivo">
      <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="italic" style="fill:currentColor;stroke:none;">I</text></svg>
    </button>

    <button id="btn-strike" class="tool icon-only" data-cmd="strike" title="Barrato">
      <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" text-decoration="line-through" style="fill:currentColor;stroke:none;">S</text></svg>
    </button>
  </div>

  <div class="sep"></div>

  <button id="btn-align" class="tool icon-only" data-cmd="align" title="Cambia allineamento del testo">
    <svg id="icon-align-left" viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg>
    <svg id="icon-align-center" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="6" y1="18" x2="18" y2="18"/></svg>
    <svg id="icon-align-right" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="7" y1="18" x2="20" y2="18"/></svg>
    <svg id="icon-align-justify" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>

  <div class="sep"></div>

  <div class="zoom-group">
    <button id="btn-zoom-out" class="tool icon-only" data-cmd="zoom-out" title="Riduci zoom">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="7" y1="10" x2="13" y2="10"/></svg>
    </button>

    <button id="btn-zoom-in" class="tool icon-only" data-cmd="zoom-in" title="Aumenta zoom">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="10" y1="7" x2="10" y2="13"/><line x1="7" y1="10" x2="13" y2="10"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <button id="btn-theme" class="tool icon-only" data-cmd="theme" title="Cambia tema chiaro/scuro">
    <svg id="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></svg>
    <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
  </button>

</div>

<script src="script.js"></script>
</body>
</html>
