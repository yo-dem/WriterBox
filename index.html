<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WriterBox — Editor per romanzi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="editor-wrapper">
  <div id="editor" contenteditable="true" spellcheck="true" lang="it" data-placeholder="Inizia a scrivere il tuo romanzo…"></div>
</main>

<div id="save-indicator" aria-live="polite">Salvato</div>

<div id="lock-indicator" aria-live="polite">
  <svg viewBox="0 0 24 24" width="12" height="12"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  Sola lettura
</div>

<div id="toolbar" class="dock-top" role="toolbar" aria-label="Strumenti di editing">

  <button id="drag-handle" class="handle" title="Trascina per riposizionare la barra" aria-label="Trascina per riposizionare">
    <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="7" cy="6" r="1.6"/><circle cx="17" cy="6" r="1.6"/><circle cx="7" cy="12" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
  </button>

  <div class="sep"></div>

  <div class="format-group">
    <button id="btn-bold" class="tool icon-only" data-cmd="bold" title="Grassetto">
      <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" style="fill:currentColor;stroke:none;">B</text></svg>
    </button>

    <button id="btn-italic" class="tool icon-only" data-cmd="italic" title="Corsivo">
      <svg viewBox="0 0 24 24" width="20" height="20"><text x="12" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" font-style="italic" style="fill:currentColor;stroke:none;">I</text></svg>
    </button>
  </div>

  <div class="sep"></div>

  <button id="btn-align" class="tool icon-only" data-cmd="align" title="Cambia allineamento del testo">
    <svg id="icon-align-left" viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="17" y2="18"/></svg>
    <svg id="icon-align-center" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="6" y1="18" x2="18" y2="18"/></svg>
    <svg id="icon-align-right" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="10" y1="12" x2="20" y2="12"/><line x1="7" y1="18" x2="20" y2="18"/></svg>
    <svg id="icon-align-justify" viewBox="0 0 24 24" width="20" height="20" style="display:none"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>

  <div class="sep"></div>

  <div class="zoom-group">
    <button id="btn-zoom-out" class="tool icon-only" data-cmd="zoom-out" title="Riduci zoom">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="7" y1="10" x2="13" y2="10"/></svg>
    </button>

    <button id="btn-zoom-reset" class="tool icon-only" data-cmd="zoom-reset" title="Reimposta zoom al 100%">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 4v6h6"/><path d="M3.5 14.5a8 8 0 1 0 2-9L3 8"/></svg>
    </button>

    <button id="btn-zoom-in" class="tool icon-only" data-cmd="zoom-in" title="Aumenta zoom">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="10" y1="7" x2="10" y2="13"/><line x1="7" y1="10" x2="13" y2="10"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <button id="btn-theme" class="tool icon-only" data-cmd="theme" title="Cambia tema chiaro/scuro">
    <svg id="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></svg>
    <svg id="icon-moon" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
  </button>

  <div class="sep"></div>

  <button id="btn-lock" class="tool icon-only" data-cmd="lock-toggle" title="Blocca/Sblocca modalità modifica">
    <svg id="icon-lock-closed" viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <svg id="icon-lock-open" viewBox="0 0 24 24" width="20" height="20" style="display:none"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.8-1.6"/></svg>
  </button>

  <div class="sep"></div>

  <button id="btn-settings" class="tool icon-only" data-cmd="settings" title="Impostazioni">
    <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.91 2.91l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2.06 2.06 0 0 1-4.12 0v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.91-2.91l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2.06 2.06 0 0 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.91-2.91l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2.06 2.06 0 0 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.91 2.91l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2.06 2.06 0 0 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
  </button>

</div>

<div id="settings-overlay" class="settings-overlay" aria-hidden="true">
  <div id="settings-modal" class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title">Impostazioni</h2>
      <button id="settings-close" class="settings-close" aria-label="Chiudi impostazioni">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>

    <div class="settings-row">
      <label class="settings-label">Tipo di carattere</label>
      <div class="segmented" id="font-family-options">
        <button type="button" class="segmented-btn" data-font="serif">Serif</button>
        <button type="button" class="segmented-btn" data-font="sans">Sans</button>
        <button type="button" class="segmented-btn" data-font="mono">Mono</button>
      </div>
    </div>

    <div class="settings-row">
      <label class="settings-label" for="font-size-range">Dimensione testo</label>
      <div class="settings-slider">
        <input type="range" id="font-size-range" min="13" max="34" step="1">
        <span id="font-size-value" class="settings-value"></span>
      </div>
    </div>

    <div class="settings-row">
      <label class="settings-label">Larghezza testo</label>
      <div class="segmented" id="width-options">
        <button type="button" class="segmented-btn" data-width="small">Piccola</button>
        <button type="button" class="segmented-btn" data-width="medium">Media</button>
        <button type="button" class="segmented-btn" data-width="large">Massima</button>
      </div>
    </div>

    <div class="settings-row">
      <label class="settings-label" for="line-height-range">Interlinea</label>
      <div class="settings-slider">
        <input type="range" id="line-height-range" min="1.2" max="2.4" step="0.1">
        <span id="line-height-value" class="settings-value"></span>
      </div>
    </div>

    <div class="settings-row">
      <label class="settings-label" for="para-spacing-range">Spazio dopo paragrafo</label>
      <div class="settings-slider">
        <input type="range" id="para-spacing-range" min="0" max="2.5" step="0.1">
        <span id="para-spacing-value" class="settings-value"></span>
      </div>
    </div>

    <div class="settings-row settings-row-reset">
      <button type="button" id="settings-reset" class="settings-reset">Ripristina impostazioni predefinite</button>
    </div>
  </div>
</div>

<div id="lock-overlay" class="settings-overlay" aria-hidden="true">
  <div id="lock-modal" class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="settings-header">
      <h2 id="lock-title">Sblocca modifica</h2>
      <button id="lock-close" class="settings-close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="18" height="18"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>

    <form id="lock-form" autocomplete="off">
      <div class="settings-row">
        <label class="settings-label" for="lock-username">Nome utente</label>
        <input type="text" id="lock-username" class="lock-input" autocomplete="username">
      </div>

      <div class="settings-row">
        <label class="settings-label" for="lock-password">Password</label>
        <input type="password" id="lock-password" class="lock-input" autocomplete="current-password">
      </div>

      <div id="lock-error" class="lock-error" aria-live="polite"></div>

      <div class="settings-row settings-row-reset">
        <button type="submit" class="settings-reset lock-submit">Sblocca</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
